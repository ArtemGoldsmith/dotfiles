- defaults:
    link:
      relink: true
      create: true
      force: true

- clean: ['~']

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [git config core.hooksPath githooks, Wiring the secret-scanning pre-commit hook]

- link:
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/config/paths.zsh
    ~/.inputrc: inputrc
    ~/.config/git/hooks: githooks/global
    ~/.claude/statusline-command.sh: claude/statusline-command.sh
    ~/.claude/iterm-status.sh: claude/iterm-status.sh
